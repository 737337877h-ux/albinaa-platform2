# منصة البناء الراقي — Milestone 2: PostgreSQL + Backend + Frontend
# التشغيل الكامل بأمر واحد:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: albinaa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: albinaa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-albinaa_dev_only}
      POSTGRES_DB: albinaa
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ar --encoding=UTF8"
    ports:
      - "6543:5432"
    volumes:
      - albinaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albinaa -d albinaa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: albinaa-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      APP_VERSION: 1.2.1
      DATABASE_URL: postgresql://albinaa:${DB_PASSWORD:-albinaa_dev_only}@db:5432/albinaa?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?يجب ضبط JWT_ACCESS_SECRET في .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?يجب ضبط JWT_REFRESH_SECRET في .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: http://localhost:3001
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-ChangeMe!2026}
      TZ: Asia/Aden
      RISK_AUTO_RECALCULATE_ENABLED: ${RISK_AUTO_RECALCULATE_ENABLED:-true}
      RISK_RECALCULATE_HOUR: ${RISK_RECALCULATE_HOUR:-2}
    volumes:
      - albinaa_uploads:/data/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:3000
    container_name: albinaa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://backend:3000
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  albinaa_pgdata:
  albinaa_uploads:
