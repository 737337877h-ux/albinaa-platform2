name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Typecheck, Lint, Build, Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint --if-present

      - run: npm run build

      - run: npm test

  frontend:
    name: Frontend — Typecheck, Lint, Build, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - run: npm test --if-present

  docker:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t albinaa-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://backend:3000 -t albinaa-frontend:ci .
