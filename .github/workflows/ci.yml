name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Typecheck, Lint, Build, Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Python parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Parser unit tests (Python)
        working-directory: backend/parser
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest test_import_profiles

      - name: Validate dependency-free performance test
        working-directory: .
        run: python -m py_compile scripts/load_test.py

      - name: Generate Prisma Client
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend — Typecheck, Lint, Build, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Tests
        run: npm test --if-present

  mobile:
    name: Mobile — Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test -- --runInBand

  docker:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        env:
          POSTGRES_USER: albinaa_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          ADMIN_INITIAL_PASSWORD: ci-only-admin-password
          CORS_ORIGINS: https://example.invalid
          NEXT_PUBLIC_API_URL: https://example.invalid/api
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate backup and restore scripts
        run: |
          sh -n scripts/backup-runner.sh
          sh -n scripts/restore-test.sh
          sh -n scripts/restore.sh
          grep -F "0 2 * * * /bin/sh /usr/local/bin/backup-runner.sh full" docker-compose.prod.yml
          grep -F "5 * * * * /bin/sh /usr/local/bin/backup-runner.sh differential" docker-compose.prod.yml
          grep -F "0 4 1 * * /bin/sh /usr/local/bin/restore-test.sh" docker-compose.prod.yml

      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            if docker build -f backend/Dockerfile -t albinaa-backend:ci .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Backend image build failed on attempt $attempt; retrying..."
            sleep $((attempt * 10))
          done

      - name: Build frontend image
        run: |
          for attempt in 1 2 3; do
            if docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://backend:3000 -t albinaa-frontend:ci .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Frontend image build failed on attempt $attempt; retrying..."
            sleep $((attempt * 10))
          done
