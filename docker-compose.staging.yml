services:
  db:
    image: postgres:16-alpine
    container_name: albinaa-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: albinaa
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_DB: albinaa_staging
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ar --encoding=UTF8"
    ports:
      - "16544:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albinaa -d albinaa_staging"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: albinaa-staging-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: 1.3.0-rc.1-staging
      DATABASE_URL: postgresql://albinaa:${STAGING_DB_PASSWORD}@db:5432/albinaa_staging?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: http://localhost:3002
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      TZ: Asia/Aden
      RISK_AUTO_RECALCULATE_ENABLED: ${RISK_AUTO_RECALCULATE_ENABLED:-true}
      RISK_RECALCULATE_HOUR: ${RISK_RECALCULATE_HOUR:-2}
    volumes:
      - ./data/uploads:/data/uploads
    ports:
      - "18001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:3000
        NEXT_PUBLIC_APP_VERSION: 1.3.0-rc.1-staging
    container_name: albinaa-staging-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://backend:3000
      NEXT_PUBLIC_APP_VERSION: 1.3.0-rc.1-staging
    ports:
      - "3002:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
