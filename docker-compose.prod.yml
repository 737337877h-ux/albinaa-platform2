# ============================================================================
# منصة البناء الراقي — Production Docker Compose
# التشغيل: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: albinaa-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-albinaa}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ar --encoding=UTF8"
    volumes:
      - albinaa_pgdata:/var/lib/postgresql/data
      - albinaa_wal_archive:/wal-archive
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=3600
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-albinaa} -d ${POSTGRES_DB:-albinaa}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - albinaa-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: albinaa-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.3.0-rc.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-albinaa}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-albinaa}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?}
      TZ: Asia/Aden
      RISK_AUTO_RECALCULATE_ENABLED: ${RISK_AUTO_RECALCULATE_ENABLED:-true}
      RISK_RECALCULATE_HOUR: ${RISK_RECALCULATE_HOUR:-2}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
    volumes:
      - albinaa_uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - albinaa-internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3000}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.3.0-rc.1}
    container_name: albinaa-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - albinaa-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: albinaa-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - albinaa-internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backup:
    image: postgres:16-alpine
    container_name: albinaa-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:-albinaa}
      POSTGRES_DB: ${POSTGRES_DB:-albinaa}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DIFF_RETENTION_DAYS: ${DIFF_RETENTION_DAYS:-7}
    volumes:
      - albinaa_backups:/backups
      - albinaa_wal_archive:/wal-archive
      - ./scripts/backup-runner.sh:/usr/local/bin/backup-runner.sh:ro
      - ./scripts/restore-test.sh:/usr/local/bin/restore-test.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' \
          '0 2 * * * /bin/sh /usr/local/bin/backup-runner.sh full' \
          '5 * * * * /bin/sh /usr/local/bin/backup-runner.sh differential' \
          '0 4 1 * * /bin/sh /usr/local/bin/restore-test.sh' | crontab -
        crond -f -L /dev/stdout
    networks:
      - albinaa-internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  albinaa_pgdata:
  albinaa_uploads:
  albinaa_backups:
  albinaa_wal_archive:
  nginx_logs:

networks:
  albinaa-internal:
    driver: bridge
