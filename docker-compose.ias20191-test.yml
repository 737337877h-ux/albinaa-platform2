name: albinaa-ias20191-test

services:
  db:
    image: postgres:16-alpine
    container_name: albinaa-ias20191-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: albinaa_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run with --env-file .env.ias20191-test}
      POSTGRES_DB: albinaa_ias20191_test
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ar --encoding=UTF8"
    ports:
      - "16546:5432"
    volumes:
      - ./data-ias20191-test/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albinaa_test -d albinaa_ias20191_test"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: albinaa-ias20191-test-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: 1.3.0-ias20191-test
      DATABASE_URL: postgresql://albinaa_test:${TEST_DB_PASSWORD_URLENCODED:?Run with --env-file .env.ias20191-test}@db:5432/albinaa_ias20191_test?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run with --env-file .env.ias20191-test}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run with --env-file .env.ias20191-test}
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      CORS_ORIGINS: http://localhost:3004,http://127.0.0.1:3004
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Run with --env-file .env.ias20191-test}
      TZ: Asia/Aden
      RISK_AUTO_RECALCULATE_ENABLED: "false"
      ORACLE_READ_API_URL: http://host.docker.internal:13018
      ORACLE_READ_API_KEY: ${ORACLE_READ_API_KEY:?Run with --env-file .env.ias20191-test}
      ORACLE_READ_SCHEMA: IAS20261
      ORACLE_TEST_READ_API_URL: http://host.docker.internal:13013
      ORACLE_TEST_READ_API_KEY: ${ORACLE_READ_API_KEY:?Run with --env-file .env.ias20191-test}
      ORACLE_TEST_READ_SCHEMA: IAS20191
      ORACLE_TEST_DIRECT_LOOKUPS_ENABLED: "true"
      ORACLE_WRITE_ENABLED: "true"
      ORACLE_WRITE_API_URL: http://host.docker.internal:13012
      ORACLE_WRITE_API_KEY: ${ORACLE_WRITE_API_KEY:?Run with --env-file .env.ias20191-test}
      ORACLE_WRITE_SCHEMA: IAS20191
      ORACLE_IAS20261_PURCHASE_WRITE_ENABLED: ${ORACLE_IAS20261_PURCHASE_WRITE_ENABLED:-false}
      ORACLE_IAS20261_PURCHASE_WRITE_API_URL: http://host.docker.internal:13014
      ORACLE_IAS20261_PURCHASE_WRITE_API_KEY: ${ORACLE_IAS20261_PURCHASE_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_PURCHASE_WRITE_SCHEMA: IAS20261
      ORACLE_IAS20261_RECEIPT_WRITE_ENABLED: ${ORACLE_IAS20261_RECEIPT_WRITE_ENABLED:-false}
      ORACLE_IAS20261_RECEIPT_WRITE_API_URL: http://host.docker.internal:13014
      ORACLE_IAS20261_RECEIPT_WRITE_API_KEY: ${ORACLE_IAS20261_RECEIPT_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_RECEIPT_WRITE_SCHEMA: IAS20261
      ORACLE_IAS20261_PAYMENT_WRITE_ENABLED: ${ORACLE_IAS20261_PAYMENT_WRITE_ENABLED:-false}
      ORACLE_IAS20261_PAYMENT_WRITE_API_URL: http://host.docker.internal:13215
      ORACLE_IAS20261_PAYMENT_WRITE_API_KEY: ${ORACLE_IAS20261_PAYMENT_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_PAYMENT_WRITE_SCHEMA: IAS20261
      ORACLE_IAS20261_JOURNAL_WRITE_ENABLED: ${ORACLE_IAS20261_JOURNAL_WRITE_ENABLED:-false}
      ORACLE_IAS20261_JOURNAL_WRITE_API_URL: http://host.docker.internal:13216
      ORACLE_IAS20261_JOURNAL_WRITE_API_KEY: ${ORACLE_IAS20261_JOURNAL_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_JOURNAL_WRITE_SCHEMA: IAS20261
      ORACLE_IAS20261_INVENTORY_WRITE_ENABLED: ${ORACLE_IAS20261_INVENTORY_WRITE_ENABLED:-false}
      ORACLE_IAS20261_INVENTORY_WRITE_API_URL: http://host.docker.internal:13217
      ORACLE_IAS20261_INVENTORY_WRITE_API_KEY: ${ORACLE_IAS20261_INVENTORY_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_INVENTORY_WRITE_SCHEMA: IAS20261
      ORACLE_IAS20261_TRANSFER_WRITE_ENABLED: ${ORACLE_IAS20261_TRANSFER_WRITE_ENABLED:-false}
      ORACLE_IAS20261_TRANSFER_WRITE_API_URL: http://host.docker.internal:13014
      ORACLE_IAS20261_TRANSFER_WRITE_API_KEY: ${ORACLE_IAS20261_TRANSFER_WRITE_API_KEY:-disabled}
      ORACLE_IAS20261_TRANSFER_WRITE_SCHEMA: IAS20261
      PUSH_ENABLED: "false"
    volumes:
      - ./data-ias20191-test/uploads:/data/uploads
    ports:
      - "18003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:3000
        NEXT_PUBLIC_APP_VERSION: 1.3.0-ias20191-test
    container_name: albinaa-ias20191-test-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://backend:3000
      NEXT_PUBLIC_APP_VERSION: 1.3.0-ias20191-test
    ports:
      - "3004:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
